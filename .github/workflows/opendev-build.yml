name: OpenDev Build

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "packages/opendev/**"
      - "packages/core/**"
      - "packages/server/**"
      - "packages/tui/**"
      - "packages/protocol/**"
      - "packages/schema/**"
      - "packages/llm/**"
      - "packages/plugin/**"
      - "packages/sdk/**"
      - "packages/effect-drizzle-sqlite/**"
      - "packages/effect-sqlite-node/**"
      - "packages/script/**"
      - ".github/workflows/opendev-build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g., 1.0.0)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  GH_REPO: MeNotRob0t/OpenDev_Builds
  OPENDEV_BUILDS_PAT: ${{ secrets.OPENDEV_BUILDS_PAT }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            RELEASE=true
            PRERELEASE=${{ github.event.inputs.prerelease && 'true' || 'false' }}
          else
            # Auto-generate version from date for dev builds
            VERSION="0.0.0-dev-$(date +%Y%m%d-%H%M%S)"
            RELEASE=false
            PRERELEASE=true
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64
          - os: ubuntu-latest
            target: linux-x64-musl
          - os: ubuntu-latest
            target: linux-arm64-musl
          - os: macos-latest
            target: macos-x64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
          - os: windows-latest
            target: windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Build OpenDev CLI
        working-directory: packages/opendev
        run: bun run script/build.ts --target=${{ matrix.target }}
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: "false"

      - name: Rename artifacts
        working-directory: packages/opendev/dist
        shell: bash
        run: |
          # Map directory names to build names
          declare -A NAMES=(
            ["opendev-linux-arm64"]="OpenDev_Build_Linux_arm64"
            ["opendev-linux-x64"]="OpenDev_Build_Linux_x64"
            ["opendev-linux-x64-baseline"]="OpenDev_Build_Linux_x64"
            ["opendev-linux-arm64-musl"]="OpenDev_Build_Linux_arm64_musl"
            ["opendev-linux-x64-musl"]="OpenDev_Build_Linux_x64_musl"
            ["opendev-darwin-arm64"]="OpenDev_Build_macOS_arm64"
            ["opendev-darwin-x64"]="OpenDev_Build_macOS_x64"
            ["opendev-darwin-x64-baseline"]="OpenDev_Build_macOS_x64"
            ["opendev-windows-arm64"]="OpenDev_Build_Windows_arm64"
            ["opendev-windows-x64"]="OpenDev_Build_Windows_x64"
            ["opendev-windows-x64-baseline"]="OpenDev_Build_Windows_x64"
          )
          
          for dir in */; do
            DIR_NAME="${dir%/}"
            if [[ -d "$dir/bin" ]]; then
              BUILD_NAME="${NAMES[$DIR_NAME]:-$DIR_NAME}"
              if [[ "$DIR_NAME" == *"linux"* ]]; then
                tar -czf "../../${BUILD_NAME}.tar.gz" -C "$dir/bin" .
              else
                zip -r "../../${BUILD_NAME}.zip" -C "$dir/bin" .
              fi
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opendev-${{ matrix.target }}
          path: |
            packages/opendev/*.tar.gz
            packages/opendev/*.zip

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: OpenDev ${{ needs.version.outputs.version }}
          body: |
            ## OpenDev ${{ needs.version.outputs.version }}
            
            Pre-built binaries for OpenDev CLI.
            
            ### Installation
            
            **Linux/macOS:**
            ```bash
            curl -fsSL https://github.com/MeNotRob0t/OpenDev_Builds/releases/download/${{ needs.version.outputs.tag }}/OpenDev_Build_Linux_x64.tar.gz | tar -xz -C /usr/local/bin
            ```
            
            **Windows (PowerShell):**
            ```powershell
            Invoke-WebRequest -Uri "https://github.com/MeNotRob0t/OpenDev_Builds/releases/download/${{ needs.version.outputs.tag }}/OpenDev_Build_Windows_x64.zip" -OutFile "OpenDev.zip"
            Expand-Archive -Path "OpenDev.zip" -DestinationPath "OpenDev"
            ```
            
            ### Available Binaries
            - OpenDev_Build_Linux_x64
            - OpenDev_Build_Linux_arm64
            - OpenDev_Build_Linux_x64_musl
            - OpenDev_Build_Linux_arm64_musl
            - OpenDev_Build_macOS_x64
            - OpenDev_Build_macOS_arm64
            - OpenDev_Build_Windows_x64
            - OpenDev_Build_Windows_arm64
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease }}
          repo: ${{ env.GH_REPO }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ env.OPENDEV_BUILDS_PAT }}