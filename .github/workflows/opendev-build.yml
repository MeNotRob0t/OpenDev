````yaml
name: OpenDev Build

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "packages/opendev/**"
      - "packages/core/**"
      - "packages/server/**"
      - "packages/tui/**"
      - "packages/protocol/**"
      - "packages/schema/**"
      - "packages/llm/**"
      - "packages/plugin/**"
      - "packages/sdk/**"
      - "packages/effect-drizzle-sqlite/**"
      - "packages/effect-sqlite-node/**"
      - "packages/script/**"
      - ".github/workflows/opendev-build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g., 1.0.0)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  GH_REPO: MeNotRob0t/OpenDev_Builds

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            RELEASE=true
            PRERELEASE=${{ github.event.inputs.prerelease && 'true' || 'false' }}
          else
            # Auto-generate version from date for dev builds
            VERSION="0.0.0-dev-$(date +%Y%m%d-%H%M%S)"
            RELEASE=true
            PRERELEASE=true
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release=$RELEASE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: ubuntu-latest
            target: linux-x64-musl
            musl: true
          - os: ubuntu-24.04-arm
            target: linux-arm64-musl
            musl: true
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Install musl toolchain
        if: ${{ matrix.musl }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev
        shell: bash

      - name: Build OpenDev CLI
        working-directory: packages/opendev
        run: bun run script/build.ts --target=${{ matrix.target }} --skip-install --skip-embed-web-ui
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: "false"

      - name: Rename artifacts
        working-directory: packages/opendev/dist
        shell: bash
        run: |
          # Portable mapping without associative arrays (macOS bash 3.2 compat)
          get_build_name() {
            case "$1" in
              opendev-linux-arm64) echo "OpenDev_Build_Linux_arm64" ;;
              opendev-linux-x64) echo "OpenDev_Build_Linux_x64" ;;
              opendev-linux-arm64-musl) echo "OpenDev_Build_Linux_arm64_musl" ;;
              opendev-linux-x64-musl) echo "OpenDev_Build_Linux_x64_musl" ;;
              opendev-darwin-arm64) echo "OpenDev_Build_macOS_arm64" ;;
              opendev-windows-x64) echo "OpenDev_Build_Windows_x64" ;;
              *) echo "$1" ;;
            esac
          }

          for dir in */; do
            DIR_NAME="${dir%/}"
            if [ -d "$dir/bin" ]; then
              BUILD_NAME=$(get_build_name "$DIR_NAME")
              if echo "$DIR_NAME" | grep -q "linux"; then
                tar -czf "../../${BUILD_NAME}.tar.gz" -C "$dir/bin" .
              elif echo "$DIR_NAME" | grep -q "darwin"; then
                tar -czf "../../${BUILD_NAME}.tar.gz" -C "$dir/bin" .
              else
                # Windows: use PowerShell for zip (cross-platform)
                pwsh -c "Compress-Archive -Path '$dir/bin/*' -DestinationPath '../../${BUILD_NAME}.zip' -Force"
              fi
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opendev-${{ matrix.target }}
          path: |
            packages/*.tar.gz
            packages/*.zip

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: OpenDev ${{ needs.version.outputs.version }}
          body: |
            ## OpenDev ${{ needs.version.outputs.version }}

            Pre-built binaries for OpenDev CLI.

            ### Installation

            **Linux/macOS:**
            ```bash
            curl -fsSL https://github.com/MeNotRob0t/OpenDev_Builds/releases/download/${{ needs.version.outputs.tag }}/OpenDev_Build_Linux_x64.tar.gz | tar -xz -C /usr/local/bin
            ```

            **Windows (PowerShell):**
            ```powershell
            Invoke-WebRequest -Uri "https://github.com/MeNotRob0t/OpenDev_Builds/releases/download/${{ needs.version.outputs.tag }}/OpenDev_Build_Windows_x64.zip" -OutFile "OpenDev.zip"
            Expand-Archive -Path "OpenDev.zip" -DestinationPath "OpenDev"
            ```

            ### Available Binaries
            - OpenDev_Build_Linux_x64
            - OpenDev_Build_Linux_arm64
            - OpenDev_Build_Linux_x64_musl
            - OpenDev_Build_Linux_arm64_musl
            - OpenDev_Build_macOS_arm64
            - OpenDev_Build_Windows_x64
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease }}
          repo: ${{ env.GH_REPO }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.OPENDEV_BUILDS_PAT }}
````

